[project]
name = "llm-serving-lab"
version = "0.1.0"
description = "Local LLM Serving Lab: quality / latency / throughput / memory frontier under model size, quantization, context, concurrency"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
service = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "click==8.5.0",
    "fastapi==0.136.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "prometheus-client==0.26.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "sniffio==1.3.1",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.53.0",
]

[tool.uv]
# 027: the service group is pinned to configs/vllm.lock.txt (tests/test_service_deps.py); keep it in plain `uv sync`.
default-groups = ["dev", "service"]

[tool.pytest.ini_options]
testpaths = ["tests", "service/tests"]
pythonpath = ["scripts", "benchmarks", "quality", "service"]
