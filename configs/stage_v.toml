# Stage V settings: decision 044, PREREGISTRATION §12 (DRAFT). Machine-readable; benchmarks/stage_v_plan.py checks every
# value against the 044 rules (stage_v_problems) and refuses a plan otherwise. Like configs/stage_d.toml (039), Stage V
# never writes configs/pins.toml, configs/capacity.toml or configs/stage_d.toml; it reads the frozen stage_d.toml (tau1,
# var-2048, SLO, sentinel) read-only. capserve's §12 loader reads [freeze] stage_v, [freeze] gateway_path_sha256 and
# [slo] from this file (044 實作補記 9): every §12 profile is refused until stage_v = true.
schema_version = 1

[freeze]
# 044 凍結: commit and push §12, 044, this file, the five Stage V modules and their tests, the product code, the study
# profile and results/stage_v/prereg-sim/; pin the datasets; run the mini under the GPU lock and commit it; then set
# stage_v = true, mini and gateway_path_sha256, add tests/test_stage_v_frozen.py, and only then collect Stage V data.
# stage_v_plan refuses true unless mini names a passed smoke-v-* session of this harness on this request path.
stage_v = false
mini = ""                                                 # session id of the passed mini smoke (smoke-v-<date>)
gateway_path_sha256 = ""                                  # the frozen request path (stage_v_plan.gateway_path_sha256)

[stage_v]
seed = 20261008                                           # Core B seed (block orders, the V1 / V4 datasets)
n = 5                                                     # runs per point, one boot each (039 D-C)
guard_band = 0.05                                         # 030 8.1 m
stage_d_sha256 = "be7909b1e98183c337182f9559953e2613cad96f06d03899815fc0af88cba2a5"  # the frozen stage_d.toml (039)
hour_caps_h = { mini = 1.0, V-ADM = 3.5, V-CLS = 7.0 }    # per session, about 1.3 x the estimate
total_cap_h = 12                                          # every V session (mini, formal, reruns, aborted)
min_gap_h = 2                                             # between formal V sessions (finished_at to start)
run_overhead_s = { B0 = 95, T = 110 }                     # per run besides the bench: D-C's 94 s; T's boot
nontrivial = { u_w = 0.9, n1 = 0.9 }                      # V4: U_W >= 0.9 x 32; V2: requests in vLLM >= 0.9 C
join_tolerance_ms = 50                                    # (h): each gateway ttft_s <= client ttft + 50 ms
gateway_drain_s = 5                                       # D-C's drain_timeout_s
# the request path: the AST import closure of service/capserve/__main__.py (stage_v_plan.gateway_path_files)
gateway_path_files = [
    "service/capserve/__init__.py",
    "service/capserve/__main__.py",
    "service/capserve/admission.py",
    "service/capserve/app.py",
    "service/capserve/config.py",
    "service/capserve/gateway_path.py",
    "service/capserve/guard.py",
    "service/capserve/keys.py",
    "service/capserve/metrics.py",
    "service/capserve/openai_api.py",
    "service/capserve/profile.py",
    "service/capserve/proxy.py",
    "service/capserve/retry.py",
    "service/capserve/server.py",
    "service/capserve/tokens.py",
    "service/capserve/upstream.py",
]

[stage_v.sessions]
# 044: each session's points (block_order shuffles from this order); V-ADM first, then V-CLS, >= 2 h apart
mini = ["GW-U8K-O512", "L-U8K", "GW-M8K-T", "P-U2K", "F-U2K-var", "W-mini"]
V-ADM = ["P-U2K", "P-U8K", "P-U2K-var", "F-U2K-var", "F-U2K", "W-90", "W-50"]
V-CLS = ["GW-U32K", "GW-U2K-O512", "GW-U8K-O512", "GW-M8K-T", "L-U2K", "L-U8K"]

# Points: server_base (the stage_d_plan workload whose server boots: B0, or T), client_base (stage_d_plan.bench_argv_for
# builds the client from it, with only 044's three differences), tau_base (its tau1 sets the timeout); profile and its
# sha256 (the bytes served), classes (weighted-v1: both, in admission order), provisional (served with
# --allow-provisional), queue ([stage_v.queue]), admission (weighted-v1, [stage_v.weighted_v1]), pacing (a tier of
# [stage_v.pacing], or ""), dataset ("" for the random dataset; per_block: block r reads <dataset>-r<r>), out_pinned (L
# points: --custom-output-len -1), view ("worse": the worse of upstream and client), unit (the [stage_v.units] product
# unit the point belongs to, or "" for none; every point skips alone, 044 實作補記六 item 6), bench_est_s (044's
# estimate), limits (what /readyz must report; weighted-v1: its envelope).

