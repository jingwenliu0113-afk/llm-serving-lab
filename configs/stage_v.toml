[stage_v.queue]
# the gateway's max_queue_wait_s / request_deadline_s: the product defaults (V-GW, V1; D-C's), or "slow" (V2, V4)
product = { max_queue_wait_s = 2.0, request_deadline_s = 300.0 }
slow = { max_queue_wait_s = 120.0, request_deadline_s = 600.0 }

[stage_v.weighted_v1]
# 043 7.3 A: the gateway's [admission] verbatim. Strict FIFO with head-of-line blocking (the controller's only order);
# 2K (1,920 tokens) and 8K (8,064 tokens) are the study profile's class limits.
policy = "weighted-v1"
budget = 32
max_queue = 32
classes = [{ name = "v-uniform-2k", units = 1, max_concurrency = 32 }, { name = "v-uniform-8k", units = 4, max_concurrency = 8 }]

[stage_v.pacing]
# 044 V2, frozen by rule: slope = the least-squares slope of the mean largest first-wave TTFT over C <= C_KV in source
# (2K 324.23 ms, 8K 1,389.15 ms; the file's own fit spans every C); rate = round_to x floor(prompt / slope / round_to);
# burst = burst_requests x prompt, burst_requests = floor(0.95 x the tier's S2 TTFT / slope) (042 D5).
# stage_v_plan.pacing_problems recomputes it from the committed file (a WSL deploy carries no results/).
source = "results/stage_d/d5-startup-wave/analysis.json"
round_to = 10
"2048" = { workload = "U2K", prompt = 1920, c_kv = 35, burst_requests = 5, burst_tokens = 9600, rate_tokens_per_s = 5920 }
"8192" = { workload = "U8K", prompt = 8064, c_kv = 13, burst_requests = 4, burst_tokens = 32256, rate_tokens_per_s = 5800 }

