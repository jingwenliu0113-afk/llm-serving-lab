# then collect Stage Q data. stage_q_analysis refuses formal sessions unless every pilot below exists under
# results/stage_q/<id> with its part, mode pilot, every job ok and the current harness_sha256.
stage_q = true                                            # 040 凍結, 2026-10-25 (harness 34256f12...)
pilot_q1_metal = "pilot-q1-metal-20261023"                # session id of the passed q1-metal pilot (Mac)
pilot_q1_cuda = "pilot-q1-cuda-20261025"                  # session id of the passed q1-cuda pilot (RTX)
pilot_q2 = "pilot-q2-20261025b"                           # session id of the passed q2 pilot (RTX)

[stage_q]
phase1_session = "formal-20261010-quality"                # 005 / 020: the CUDA PPL and the KLD at -c 512
