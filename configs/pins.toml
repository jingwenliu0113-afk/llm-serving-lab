# Machine-readable Day 1 pins. Rationale lives in docs/decisions/002-007.
# Invariants are enforced by tests/test_pins.py.
schema_version = 1

# Staged pre-registration (docs/decisions/006-staged-preregistration.md).
# mac    = stage A committed: all hypotheses + Core A protocol + quality task set.
#          Requires every derived GGUF sha256/size and the quality subsets below.
# nvidia = stage B addendum committed: RTX / Core B protocol parameters only.
#          Requires the CUDA toolchain, the vLLM lock file and Core B verified.
[freeze]
mac = false
nvidia = false

# ------------------------------------------------------------------ runtimes --

[llama_cpp]
# docs/decisions/002-llama-cpp-pin.md
repo = "https://github.com/ggml-org/llama.cpp"
tag = "b11146"
release = "v0.5.0"                                       # same commit as b11146
commit = "7fe450e19305b828c199d602c23a8337aaa1f03b"
build_number = 11146
published_utc = "2026-09-23T18:36:37Z"
# verified = built at this pin via scripts/build_llama_cpp.sh, --version banner matches
# (build 11146, full commit), backend device initialises (--list-devices). Model-level
# smoke test is Week 1 #1.
verified = ["macos-metal"]                               # 2026-10-08: MTL0 Apple M4 Pro, 38338 MiB
pending = ["wsl2-cuda"]                                  # blocked: remote unavailable

[llama_cpp.toolchain]
cmake = "4.4.3"                                          # uvx --from cmake==4.4.3 (must match the build script)

[llama_cpp.toolchain.macos_metal]
compiler = "AppleClang 21.0.0.21000334"                  # Xcode 27.0 toolchain, macOS 27.0.1 (26A434)

[llama_cpp.toolchain.wsl2_cuda]
compiler = ""                                            # filled when the remote build runs
cuda_toolkit = "12.8"                                    # decision 002 (2026-10-08): cuda-toolkit-12-8, nvcc 12.8.93; not installed yet
# WSL2 Ubuntu-22.04.5, driver 617.42 (CUDA UMD 13.4), RTX 5070 Ti compute_cap 12.0, 16303 MiB

[vllm]
# docs/decisions/003-vllm-pin-and-core-b-precision.md
version = "0.30.0"
commit = "ced6857afa0ea7b2e3f0846a62e1394e90f15607"     # git tag v0.30.0
wheel_sha256 = "ef52ee58c410ead0b8afb190838fa4cbcb52075596f67862a03859d984966ac4"  # cp38-abi3-manylinux_2_28_x86_64
published_utc = "2026-09-22"
verified = []
pending = ["wsl2-cuda"]                                  # blocked: remote unavailable
lock_file = ""                                           # hashed lock frozen after the smoke test (configs/)

# Versions from the v0.30.0 CI lock (requirements/test/cuda.txt). Resolve with
# `uv pip compile --exclude-newer <exclude_newer>` so transitive deps cannot float.
[vllm.deps]
torch = "2.13.0"                                         # PyPI build = CUDA 13.0
transformers = "5.16.1"
tokenizers = "0.23.1"
huggingface-hub = "1.31.0"
triton = "3.7.1"
exclude_newer = "2026-09-23T00:00:00Z"                   # end of the vLLM 0.30.0 release day

