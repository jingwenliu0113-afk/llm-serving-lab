# -------------------------------------------------------------------- Core B --

[core_b]
# docs/decisions/003-vllm-pin-and-core-b-precision.md
# Model fixed by user decision (2026-10-08): no fallback / alternatives.
# status stays "proposed" until the 003 smoke-test gate passes on the RTX 5070 Ti.
status = "proposed"
family = "Qwen3"
repo = "Qwen/Qwen3-8B-AWQ"
revision = "4da05a8edb55c6046cce958586c33b61da07bb79"
precision = "awq-w4a16"                                  # INT4 weight-only, group 128, Marlin kernels
dtype = "float16"
kv_cache_dtype = "auto"                                  # KV quantization is an Advanced item: off in Core
mix_dataset_sha256 = ""                                  # seeded `mixed` dataset (decision 007), built at Stage B


